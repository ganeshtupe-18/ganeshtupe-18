<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Ganesh Tupe — Java Developer</title>
  <desc id="desc">Burgundy animated developer banner with subtle moving light and technical grid details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10070C"/><stop offset="48%" stop-color="#2A0D1B"/><stop offset="100%" stop-color="#451126"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C77B9B" stop-opacity="0"/><stop offset="50%" stop-color="#E5B5C7" stop-opacity=".8"/><stop offset="100%" stop-color="#C77B9B" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#E5B5C7" stroke-opacity=".10"/><circle cx="0" cy="0" r="1.4" fill="#E5B5C7" fill-opacity=".22"/></pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/><rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="1000" cy="60" r="170" fill="#701A3D" opacity=".22"><animate attributeName="r" values="150;190;150" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="1060" cy="270" r="110" fill="#C77B9B" opacity=".08"/>
  <path d="M-30 275 C180 190 270 360 480 245 S800 150 1230 230" fill="none" stroke="url(#glow)" stroke-width="2.5" filter="url(#softGlow)"><animate attributeName="d" dur="10s" repeatCount="indefinite" values="M-30 275 C180 190 270 360 480 245 S800 150 1230 230;M-30 230 C180 320 300 170 500 250 S850 330 1230 180;M-30 275 C180 190 270 360 480 245 S800 150 1230 230"/></path>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="76" y="122" font-size="20" letter-spacing="5" fill="#E5B5C7">HELLO, I'M</text>
    <text x="72" y="185" font-size="58" font-weight="700" fill="#F8F0F3">Ganesh Tupe</text>
    <rect x="76" y="207" width="250" height="3" rx="1.5" fill="#C77B9B" filter="url(#softGlow)"/>
    <text x="76" y="246" font-size="23" fill="#E5B5C7">Computer Engineering Student</text>
    <text x="76" y="280" font-size="20" fill="#F8F0F3" opacity=".88">Aspiring Java Developer · Learning by building</text>
    <text x="1100" y="72" font-size="15" text-anchor="end" letter-spacing="3" fill="#E5B5C7" opacity=".8">BUILD • LEARN • REPEAT</text>
  </g>
  <g fill="none" stroke="#E5B5C7" stroke-opacity=".55"><circle cx="1030" cy="166" r="68" stroke-dasharray="4 9"><animateTransform attributeName="transform" type="rotate" from="0 1030 166" to="360 1030 166" dur="35s" repeatCount="indefinite"/></circle><circle cx="1030" cy="166" r="46" stroke-dasharray="2 7"><animateTransform attributeName="transform" type="rotate" from="360 1030 166" to="0 1030 166" dur="24s" repeatCount="indefinite"/></circle><path d="M1008 147L990 166L1008 185M1052 147L1070 166L1052 185M1040 137L1020 195" stroke="#E5B5C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>